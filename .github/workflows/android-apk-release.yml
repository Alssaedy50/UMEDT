name: UMED-2 — Build Android APK (Debug & Release)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Capacitor Android Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Java JDK 21 (Required by Capacitor 8 / Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Verify Gradle SDK Versions & Setup Supported Android SDK Packages
        run: |
          COMPILE_SDK=$(grep -E "compileSdkVersion\s*=" android/variables.gradle | grep -oE "[0-9]+")
          TARGET_SDK=$(grep -E "targetSdkVersion\s*=" android/variables.gradle | grep -oE "[0-9]+")
          MIN_SDK=$(grep -E "minSdkVersion\s*=" android/variables.gradle | grep -oE "[0-9]+")
          echo "Verified from android/variables.gradle: minSdkVersion=$MIN_SDK, compileSdkVersion=$COMPILE_SDK, targetSdkVersion=$TARGET_SDK"

          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f -executable | head -n 1)
          fi
          echo "Using sdkmanager at: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run TypeScript & Lint Checks
        run: npm run lint

      - name: Build Production Web & PWA Bundle (dist) with Cloud OTA Config
        env:
          VITE_UMED_MANIFEST_URL: ${{ vars.VITE_UMED_MANIFEST_URL || 'https://raw.githubusercontent.com/Alssaedy50/UMEDT/main/data/releases/stable/manifest.json' }}
          VITE_UMED_PUBLIC_KEY_PEM: ${{ vars.VITE_UMED_PUBLIC_KEY_PEM }}
        run: npm run build

      - name: Synchronize Bundled Assets with Native Capacitor Android Project
        run: npx cap sync android

      - name: Run Automated Release Readiness Test Suite
        run: npm test

      - name: Grant Execute Permission for Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Installable Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Require Persistent Release Keystore
        id: signing_check
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'ERROR: Missing required GitHub Actions secrets: %s\\n' "${missing[*]}"
            echo "Configure the persistent release keystore secrets before building a release APK."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/umedt-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Persistent release keystore validated. This signing identity will be used for every release."
          
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect & Rename APK Outputs for Artifact Upload
        run: |
          mkdir -p artifacts/apk
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not found in android/app/build/outputs/apk/debug"
            exit 1
          fi
          cp "$DEBUG_APK" artifacts/apk/UMED-2-v2.2.3-debug.apk

          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/apk/UMED-2-v2.2.3-release-signed.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/apk/UMED-2-v2.2.3-release-unsigned.apk
          else
            RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -n "$RELEASE_APK" ]; then
              cp "$RELEASE_APK" artifacts/apk/UMED-2-v2.2.3-release-unsigned.apk
            else
              echo "ERROR: Release APK was not found in android/app/build/outputs/apk/release"
              exit 1
            fi
          fi
          ls -lh artifacts/apk/
          echo "### UMED-2 Android APK Artifacts Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** \`org.umed2.dictengine\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`2.2.3 (versionCode 20203)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Installable Debug APK:** \`UMED-2-v2.2.3-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK Signing Status:** \`signed=${{ steps.signing_check.outputs.signed }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Clean Up Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/umed2-release.keystore"

      - name: Upload Installable Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UMED-2-v2.2.3-debug-apk
          path: artifacts/apk/UMED-2-v2.2.3-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UMED-2-v2.2.3-release-apk
          path: artifacts/apk/UMED-2-v2.2.3-release-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Direct Download APKs to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.3
          name: "UMEDT Android APK v2.2.3 (Latest)"
          body: |
            ### UMEDT — محرك القاموس والمترجم الطبي الهجين (v2.2.3)
            - **نسخة التثبيت النهائية الموقّعة (Release APK):** `UMED-2-v2.2.3-release-signed.apk`
            - **نسخة الفحص (Debug APK):** `UMED-2-v2.2.3-debug.apk`
          files: |
            artifacts/apk/UMED-2-v2.2.3-release-signed.apk
            artifacts/apk/UMED-2-v2.2.3-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

