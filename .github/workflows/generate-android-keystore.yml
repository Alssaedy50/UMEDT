name: UMEDT - Generate Android Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-release-keystore:
    name: Generate one-time persistent Android signing key
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and validate the release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Create the ANDROID_KEYSTORE_PASSWORD repository secret first."
            exit 1
          fi

          if [ "${#KEYSTORE_PASSWORD}" -lt 20 ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD must contain at least 20 characters."
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore umedt-release.jks \
            -storetype JKS \
            -alias umedt-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=UMEDT Android Release, OU=Mobile, O=UMEDT, L=Taiz, ST=Taiz, C=YE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -noprompt

          keytool -list -v \
            -keystore umedt-release.jks \
            -storetype JKS \
            -alias umedt-release \
            -storepass "$KEYSTORE_PASSWORD"

          base64 -w 0 umedt-release.jks > umedt-release.base64
          printf '\n' >> umedt-release.base64

          cat > README-SETUP.txt <<'EOF'
          UMEDT Android release signing key

          Alias: umedt-release
          Keystore format: JKS
          Algorithm: RSA 2048
          Validity: 10000 days

          Next steps:
          1. Download this artifact and extract it.
          2. Open umedt-release.base64 in a text editor and copy its entire contents.
          3. In GitHub, open Settings > Secrets and variables > Actions.
          4. Create repository secret ANDROID_KEYSTORE_BASE64 and paste the copied Base64 text.
          5. Keep the existing ANDROID_KEYSTORE_PASSWORD secret unchanged.
          6. Keep umedt-release.jks in a secure personal backup. Never commit it to the repository.
          7. The release workflow uses alias umedt-release and the same password for the keystore and private key.

          The keystore artifact is encrypted with the password you supplied as ANDROID_KEYSTORE_PASSWORD.
          Do not share the artifact or password. Keep an independent backup of the JKS file.
          EOF

          echo "Keystore generated and validated. The password is not printed."
          echo "SHA-256 of keystore file:"
          sha256sum umedt-release.jks

      - name: Upload keystore setup files
        uses: actions/upload-artifact@v4
        with:
          name: UMEDT-Android-Release-Keystore-Setup
          path: |
            umedt-release.jks
            umedt-release.base64
            README-SETUP.txt
          if-no-files-found: error
          retention-days: 7
