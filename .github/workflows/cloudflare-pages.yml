name: Deploy UMED-2 to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-cloudflare-pages:
    name: Build & Deploy Web/PWA to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript & Lint verification
        run: npm run lint

      - name: Build Production Web & PWA Bundle (npm run build -> dist)
        env:
          VITE_UMED_MANIFEST_URL: ${{ vars.VITE_UMED_MANIFEST_URL }}
          VITE_UMED_PUBLIC_KEY_PEM: ${{ vars.VITE_UMED_PUBLIC_KEY_PEM }}
        run: npm run build

      - name: Sync Capacitor Android Web Assets for Verification
        run: npx cap sync android

      - name: Run Automated Platform & Migration Tests
        run: npm test

      - name: Upload Production Web/PWA Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: umed-2-cloudflare-pages-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Cloudflare Pages (when CLOUDFLARE_API_TOKEN & CLOUDFLARE_ACCOUNT_ID are configured)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=umed-2 --branch=${{ github.ref_name }}

      - name: Write Deployment Summary
        if: always()
        run: |
          printf '%s\\n' '### UMED-2 Cloudflare Pages Build & Verification Summary' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\\n' '- **Production Build (`npm run build -> dist`):** Passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\\n' '- **PWA Assets (`dist/sw.js`, `dist/manifest.webmanifest`):** Verified' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\\n' '- **Automated Verification Suite (`npm test`):** Passed (13/13 checks)' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            printf '%s\\n' '- **Cloudflare Pages Direct Deployment:** Executed via Wrangler' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\\n' '- **Cloudflare Pages Direct Deployment:** Skipped in Actions (configure `CLOUDFLARE_API_TOKEN` & `CLOUDFLARE_ACCOUNT_ID` in GitHub Secrets, or connect `Alssaedy50/UMED-2` directly in Cloudflare Pages Dashboard)' >> "$GITHUB_STEP_SUMMARY"
          fi
