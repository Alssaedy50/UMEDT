name: UMEDT Medical Data Release (GitHub Releases)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target Release Channel (stable or beta)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      target_version:
        description: 'Optional target data version (leave empty for automatic patch version bump)'
        required: false
        type: string
        default: ''
      summary:
        description: 'Release summary and clinical changelog description'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build and verify without publishing'
        required: false
        type: boolean
        default: false
concurrency:
  group: publish-data-${{ github.event.inputs.channel || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-data:
    if: github.ref == 'refs/heads/main'
    name: Build, Sign, and Publish Medical Data Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pre-Publish Code Quality & Readiness Gates
        run: |
          npm run lint
          npm test

      - name: Validate Permanent Signing Keys
        env:
          UMED_PUBLISHER_PRIVATE_KEY_PEM: ${{ secrets.UMED_PUBLISHER_PRIVATE_KEY_PEM }}
          VITE_UMED_PUBLIC_KEY_PEM: ${{ vars.VITE_UMED_PUBLIC_KEY_PEM }}
        run: |
          if [ -z "$UMED_PUBLISHER_PRIVATE_KEY_PEM" ]; then
            echo "::error::Missing secret UMED_PUBLISHER_PRIVATE_KEY_PEM."
            exit 1
          fi
          if [ -z "$VITE_UMED_PUBLIC_KEY_PEM" ]; then
            echo "::error::Missing repository variable VITE_UMED_PUBLIC_KEY_PEM."
            exit 1
          fi
          echo "Both permanent signing keys are configured."

      - name: Build & Cryptographically Sign Data Release Bundle
        id: build_bundle
        env:
          UMED_RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
          UMED_RELEASE_VERSION: ${{ github.event.inputs.target_version }}
          UMED_RELEASE_SUMMARY: ${{ github.event.inputs.summary }}
          UMED_PUBLISHER_PRIVATE_KEY_PEM: ${{ secrets.UMED_PUBLISHER_PRIVATE_KEY_PEM }}
          VITE_UMED_PUBLIC_KEY_PEM: ${{ vars.VITE_UMED_PUBLIC_KEY_PEM }}
        run: |
          npx tsx scripts/publish-data-release.ts --channel "$UMED_RELEASE_CHANNEL"

      - name: Upload Signed Release Artifacts
        if: ${{ always() && hashFiles('releases/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: umedt-data-release-${{ github.event.inputs.channel || 'stable' }}-${{ github.run_id }}
          path: releases/
          retention-days: 90
          if-no-files-found: error

      - name: Publish to GitHub Releases & Update Manifest in Main
        if: ${{ github.event.inputs.dry_run != 'true' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
        run: |
          MANIFEST_FILE="releases/manifest.json"
          CHANGELOG_FILE="releases/CHANGELOG.md"
          test -s "$MANIFEST_FILE" || { echo "::error::Release manifest was not generated."; exit 1; }
          test -s "$CHANGELOG_FILE" || { echo "::error::Release changelog was not generated."; exit 1; }

          DATA_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$MANIFEST_FILE')).dataVersion)")
          PACKAGE_FILE=$(find releases -maxdepth 1 -type f -name "*.zip" -print -quit)
          test -n "$PACKAGE_FILE" || { echo "::error::Signed ZIP package was not generated."; exit 1; }

          mkdir -p "data/releases/${CHANNEL}"
          cp -f "$MANIFEST_FILE" "data/releases/${CHANNEL}/manifest.json"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/releases/${CHANNEL}/manifest.json"
          git diff --staged --quiet || git commit -m "chore(release): update ${CHANNEL} medical manifest to v${DATA_VERSION} [skip ci]"

          git fetch origin main
          git rebase origin/main
          git push origin "HEAD:main"

          TAG_NAME="data-v${DATA_VERSION}"
          RELEASE_TARGET=$(git rev-parse HEAD)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$PACKAGE_FILE" "$MANIFEST_FILE" --clobber
          else
            gh release create "$TAG_NAME" "$PACKAGE_FILE" "$MANIFEST_FILE" \
              --title "UMEDT Medical Data v${DATA_VERSION}" \
              --notes-file "$CHANGELOG_FILE" \
              --target "$RELEASE_TARGET"
          fi

      - name: Generate Publishing Summary
        if: always()
        run: |
          MANIFEST_FILE="releases/manifest.json"
          if [ -s "$MANIFEST_FILE" ]; then
            DATA_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$MANIFEST_FILE')).dataVersion)")
            SHA256=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$MANIFEST_FILE')).sha256)")
            ALGO=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$MANIFEST_FILE')).signatureAlgorithm)")
            TERMS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$MANIFEST_FILE')).counts.terms)")
            SENTENCES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$MANIFEST_FILE')).counts.sentences)")
            echo "### UMEDT Medical Data Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Channel:** \`${{ github.event.inputs.channel || 'stable' }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Data Version:** \`${DATA_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **App Version:** \`2.2.0\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Terms:** \`${TERMS}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Sentences:** \`${SENTENCES}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Signature:** \`${ALGO}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **SHA-256:** \`${SHA256}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
